name: RFQ Service CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package Executable JAR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rfq_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5000:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x rfq-service/mvnw

      - name: Build with Maven & Run Unit/Integration Tests
        run: |
          cd rfq-service
          ./mvnw clean verify -DskipTests=false

      - name: Upload Application Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfq-service-executable-jar
          path: rfq-service/target/*.jar
          retention-days: 7
