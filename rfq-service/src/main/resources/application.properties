# ===================================================================
# RFQ to Quote Automation POC - Configuration Properties
# ===================================================================

spring.application.name=rfq-service
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (PostgreSQL)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5000/rfq_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
# FIXED: Changed from 'update' to 'validate' as per your comment to protect Flyway schema state
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FIXED: Removed explicit PostgreSQLDialect line (Hibernate auto-detects version 17.4 perfectly)
# ADDED: Removes the 'spring.jpa.open-in-view is enabled by default' warning from your startup logs
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Web & Servlet Settings
# -------------------------------------------------------------------
# ADDED: Forces DispatcherServlet to initialize on startup instead of waiting for the first API call
spring.mvc.servlet.load-on-startup=1

# -------------------------------------------------------------------
# Flyway Migration Settings
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -------------------------------------------------------------------
# OpenAPI / Swagger UI Settings
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
